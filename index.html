<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F6F2">
  <meta name="description" content="Matheo is an offline math workspace with paper-style calculation and graphing.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%23f7f6f2'/%3E%3Cpath d='M34 30h60a8 8 0 0 1 8 8v52a8 8 0 0 1-8 8H34a8 8 0 0 1-8-8V38a8 8 0 0 1 8-8Z' fill='%23ffffff' stroke='%231d232a' stroke-width='5'/%3E%3Cpath d='M42 49h44M42 66h44M42 83h18M74 83h12' stroke='%237aa2f7' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Matheo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f6f2;
      --bg-2: #ece8df;
      --ink: #1d232a;
      --muted: #65717c;
      --line: rgba(29, 35, 42, 0.1);
      --glass-bg: rgba(255, 255, 255, 0.68);
      --glass-solid: #ffffff;
      --glass-border: rgba(29, 35, 42, 0.08);
      --shadow-rest: 0 1px 2px rgba(29, 35, 42, 0.04), 0 10px 30px rgba(29, 35, 42, 0.08);
      --shadow-hover: 0 2px 4px rgba(29, 35, 42, 0.06), 0 16px 36px rgba(29, 35, 42, 0.1);
      --shadow-press: inset 0 1px 2px rgba(29, 35, 42, 0.14);
      --radius: 14px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --blue: #4f7ee8;
      --rose: #d95d76;
      --green: #5e9446;
      --amber: #bb7d28;
      --violet: #8066d6;
      --cyan: #2a8fb8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      color: var(--ink);
      font-family: var(--font);
      background:
        linear-gradient(140deg, rgba(122, 162, 247, 0.18), transparent 34%),
        linear-gradient(310deg, rgba(158, 206, 106, 0.16), transparent 32%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    #app {
      width: min(1180px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 12px;
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 2rem);
      font-weight: 760;
      line-height: 1;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-bar,
    .segmented,
    .install-area {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-rest);
      backdrop-filter: blur(20px) saturate(1.35);
      -webkit-backdrop-filter: blur(20px) saturate(1.35);
    }

    .tab-bar,
    .segmented {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 4px;
      padding: 4px;
    }

    .tab,
    .segmented button,
    .icon-btn,
    .key,
    .command-btn {
      min-height: 42px;
      border-radius: var(--radius-sm);
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .tab,
    .segmented button {
      min-width: 82px;
      padding: 0 14px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .tab[aria-selected="true"],
    .segmented button[aria-pressed="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 2px rgba(29, 35, 42, 0.07);
    }

    .install-area {
      display: none;
      min-height: 42px;
      align-items: center;
      padding: 0 10px;
    }

    .install-area.is-visible {
      display: flex;
    }

    .icon-btn,
    .command-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: 0 1px 2px rgba(29, 35, 42, 0.05);
      font-weight: 720;
    }

    .icon-btn svg,
    .command-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }

    .view {
      display: none;
      min-height: 0;
    }

    .view.is-active {
      display: grid;
    }

    #calc-view {
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }

    .calc-main {
      display: grid;
      grid-template-rows: minmax(210px, auto) auto;
      gap: 14px;
      min-width: 0;
    }

    .paper-display,
    .steps-panel,
    .keypad,
    .graph-pane,
    .equation-list,
    .graph-controls,
    .test-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-rest);
      backdrop-filter: blur(20px) saturate(1.35);
      -webkit-backdrop-filter: blur(20px) saturate(1.35);
    }

    .paper-display {
      min-height: 220px;
      padding: clamp(16px, 3vw, 26px);
      display: grid;
      grid-template-rows: 1fr auto auto;
      gap: 12px;
      overflow: hidden;
    }

    .expression-row {
      min-height: 78px;
      overflow-x: auto;
      display: flex;
      align-items: center;
      padding-bottom: 8px;
    }

    .placeholder {
      color: #8b949e;
      font-size: clamp(1.15rem, 5vw, 2.15rem);
      font-weight: 650;
    }

    .raw-input {
      width: 100%;
      min-height: 45px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 1rem;
      resize: none;
      outline: none;
    }

    .raw-input:focus {
      border-color: rgba(79, 126, 232, 0.5);
      box-shadow: 0 0 0 3px rgba(79, 126, 232, 0.12);
    }

    .result-line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .result-line output {
      color: var(--ink);
      font-size: clamp(1.5rem, 7vw, 3.1rem);
      font-weight: 780;
      line-height: 1;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .math-row {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: max-content;
    }

    .cell,
    .op-cell {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      min-height: 34px;
      padding: 4px 8px;
      border: 1px solid rgba(29, 35, 42, 0.08);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.64);
      box-shadow: 0 1px 2px rgba(29, 35, 42, 0.04);
      font-weight: 720;
      line-height: 1;
    }

    .op-cell {
      color: var(--muted);
      background: rgba(255, 255, 255, 0.42);
    }

    .func-name {
      min-width: 42px;
      color: var(--rose);
      background: rgba(217, 93, 118, 0.1);
      border-color: rgba(217, 93, 118, 0.2);
      text-transform: none;
    }

    .frac {
      display: inline-grid;
      grid-template-rows: auto 1px auto;
      align-items: center;
      gap: 4px;
      padding: 2px 4px;
    }

    .frac-rule {
      height: 1px;
      background: var(--ink);
      opacity: 0.75;
    }

    .pow {
      display: inline-flex;
      align-items: flex-start;
      gap: 1px;
    }

    .sup {
      transform: translateY(-0.48em);
      font-size: 0.65em;
    }

    .root {
      display: inline-flex;
      align-items: flex-end;
      gap: 0;
    }

    .radical {
      width: 22px;
      height: 38px;
      align-self: stretch;
    }

    .radicand {
      border-top: 2px solid rgba(29, 35, 42, 0.8);
      padding-top: 4px;
    }

    .abs {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .abs::before,
    .abs::after {
      content: "";
      width: 2px;
      min-height: 38px;
      background: rgba(29, 35, 42, 0.76);
      border-radius: 999px;
    }

    .steps-panel {
      min-height: 150px;
      max-height: 360px;
      overflow: auto;
      padding: 14px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .panel-title h2 {
      margin: 0;
      font-size: 0.98rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .panel-title span {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .step {
      display: grid;
      gap: 8px;
      padding: 11px 0;
      border-top: 1px solid var(--line);
    }

    .step:first-of-type {
      border-top: 0;
    }

    .step-rule {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 720;
    }

    .step-math {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .step-math .math-row {
      transform-origin: left center;
      font-size: 0.82rem;
    }

    .keypad {
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .keypad-wrap {
      position: relative;
    }

    .keypad-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .key-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .key {
      min-width: 0;
      min-height: 52px;
      padding: 0 6px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--glass-border);
      box-shadow: 0 1px 2px rgba(29, 35, 42, 0.04);
      font-size: clamp(0.92rem, 3.7vw, 1.06rem);
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .key.operator {
      color: var(--blue);
      background: rgba(255, 255, 255, 0.86);
    }

    .key.action {
      color: #fff;
      background: #1d232a;
    }

    .key.function {
      color: var(--rose);
    }

    .key.constant {
      color: var(--green);
    }

    .variable-popover {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: none;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      padding: 10px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow-hover);
      backdrop-filter: blur(20px) saturate(1.35);
      -webkit-backdrop-filter: blur(20px) saturate(1.35);
      z-index: 4;
    }

    .variable-popover.is-open {
      display: grid;
    }

    .variable-popover button {
      min-height: 38px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 760;
    }

    .key:hover,
    .icon-btn:hover,
    .command-btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }

    .key:active,
    .icon-btn:active,
    .command-btn:active {
      transform: translateY(0);
      box-shadow: var(--shadow-press);
    }

    #graph-view {
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }

    .equation-list {
      padding: 14px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .equation-row {
      display: grid;
      grid-template-columns: 14px 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .swatch {
      width: 12px;
      height: 34px;
      border-radius: 999px;
    }

    .equation-row input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      background: rgba(255, 255, 255, 0.76);
      outline: none;
      font-family: var(--mono);
    }

    .graph-pane {
      min-height: min(68svh, 620px);
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    .canvas-wrap {
      position: relative;
      min-height: 360px;
      background:
        linear-gradient(rgba(29, 35, 42, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(29, 35, 42, 0.035) 1px, transparent 1px),
        rgba(255, 255, 255, 0.48);
      background-size: 36px 36px;
      touch-action: none;
    }

    #plot {
      display: block;
      width: 100%;
      height: 100%;
    }

    .graph-hint {
      position: absolute;
      left: 14px;
      bottom: 14px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      pointer-events: none;
    }

    .graph-controls {
      border-width: 1px 0 0;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.56);
    }

    .viewport-readout {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.82rem;
    }

    .test-panel {
      display: none;
      padding: 12px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.88rem;
      white-space: pre-wrap;
    }

    .test-panel.is-visible {
      display: block;
    }

    .error {
      color: var(--rose);
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .tab-bar,
      .segmented,
      .install-area,
      .paper-display,
      .steps-panel,
      .keypad,
      .graph-pane,
      .equation-list,
      .graph-controls,
      .test-panel {
        background: var(--glass-solid);
      }
    }

    @media (min-width: 720px) {
      #calc-view {
        grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
        align-items: start;
      }

      .steps-panel {
        position: sticky;
        top: 16px;
        max-height: calc(100svh - 132px);
      }

      #graph-view {
        grid-template-columns: minmax(270px, 330px) minmax(0, 1fr);
      }
    }

    @media (max-width: 620px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .tab-bar,
      .install-area {
        width: 100%;
      }

      .tab-bar {
        grid-template-columns: 1fr 1fr;
      }

      .key-grid {
        gap: 7px;
      }

      .keypad-head .segmented {
        width: 100%;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .segmented button {
        min-width: 0;
        padding: 0 4px;
        font-size: 0.88rem;
      }

      .key {
        min-height: 49px;
      }

      .result-line {
        align-items: flex-start;
        flex-direction: column;
      }

      .result-line output {
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand">
        <h1>Matheo</h1>
        <p>Offline paper math and graphing</p>
      </div>
      <nav class="tab-bar" aria-label="Views">
        <button class="tab" type="button" data-tab="calc" aria-selected="true">Calc</button>
        <button class="tab" type="button" data-tab="graph" aria-selected="false">Graph</button>
      </nav>
      <div class="install-area" id="install-area">
        <button class="icon-btn" type="button" id="install-button" title="Install app" aria-label="Install app">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/></svg>
          Install
        </button>
      </div>
    </header>

    <section class="view is-active" id="calc-view" aria-label="Matheo calculator">
      <div class="calc-main">
        <section class="paper-display" aria-label="Expression display">
          <div class="expression-row" id="paper-output">
            <div class="placeholder">Tap keys or type an expression</div>
          </div>
          <textarea class="raw-input" id="expression-input" rows="1" spellcheck="false" autocomplete="off" autocapitalize="off" inputmode="text" aria-label="Expression input" placeholder="Example: (3/4 + sqrt(16))^2"></textarea>
          <div class="result-line">
            <span id="status-line">Ready</span>
            <output id="result-output" aria-live="polite">0</output>
          </div>
        </section>

        <section class="keypad" aria-label="Keypad">
          <div class="keypad-head">
            <div class="segmented" aria-label="Keypad layer">
              <button type="button" data-layer="basic" aria-pressed="true">Basic</button>
              <button type="button" data-layer="intermediate" aria-pressed="false">More</button>
              <button type="button" data-layer="advanced" aria-pressed="false">Advanced</button>
              <button type="button" data-layer="symbols" aria-pressed="false">Symbols</button>
            </div>
            <button class="command-btn" type="button" id="copy-result" title="Copy result">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15V7a2 2 0 0 1 2-2h8"/></svg>
              Copy
            </button>
          </div>
          <div class="keypad-wrap">
            <div class="key-grid" id="key-grid"></div>
            <div class="variable-popover" id="variable-popover" aria-label="Variable picker"></div>
          </div>
        </section>
      </div>

      <aside class="steps-panel" aria-label="Simplification steps">
        <div class="panel-title">
          <h2>Steps</h2>
          <span id="step-count">0</span>
        </div>
        <div id="steps-output">
          <div class="step-rule">No simplification steps yet.</div>
        </div>
      </aside>
    </section>

    <section class="view" id="graph-view" aria-label="Graph">
      <aside class="equation-list">
        <div class="panel-title">
          <h2>Equations</h2>
          <button class="icon-btn" type="button" id="add-equation" title="Add equation" aria-label="Add equation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          </button>
        </div>
        <div id="equations"></div>
      </aside>

      <section class="graph-pane">
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="plot" aria-label="Function plot"></canvas>
          <div class="graph-hint">Drag to pan. Wheel or pinch to zoom.</div>
        </div>
        <div class="graph-controls">
          <div class="viewport-readout" id="viewport-readout"></div>
          <div>
            <button class="command-btn" type="button" id="fit-graph">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
              Reset
            </button>
          </div>
        </div>
      </section>
    </section>

    <pre class="test-panel" id="test-panel" aria-live="polite"></pre>
  </main>

  <script type="module">
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    const formatNumber = value => {
      if (typeof value === 'bigint') return value.toString();
      if (!Number.isFinite(value)) return String(value);
      if (Math.abs(value) < 1e-12) return '0';
      if (Math.abs(value) >= 1e9 || Math.abs(value) < 1e-6) return value.toExponential(8).replace(/0+e/, 'e');
      return Number(value.toPrecision(12)).toString();
    };

    const gcd = (a, b) => {
      a = Math.abs(Math.trunc(a));
      b = Math.abs(Math.trunc(b));
      while (b) [a, b] = [b, a % b];
      return a || 1;
    };

    const clone = value => JSON.parse(JSON.stringify(value));
    const astText = ast => Renderer.toText(ast);
    const normalizeMathInput = input => input
      .replace(/[−–—]/g, '-')
      .replace(/[×·∙⋅]/g, '*')
      .replace(/[÷]/g, '/')
      .replace(/√/g, 'sqrt')
      .replace(/π/g, 'pi')
      .replace(/θ/g, 't')
      .replace(/φ/g, 'p')
      .replace(/α/g, 'a')
      .replace(/β/g, 'b')

        cases.forEach(([expr, expected, scope]) => {
          try {
            const ast = Parser.parse(expr);
            const { result } = Simplifier.simplify(ast);
            const symbolic = JSON.stringify(result).includes('"type":"var"') && !scope;
            const value = symbolic ? NaN : Evaluator.evalAst(result, scope);
            const ok = Number.isNaN(expected) ? Number.isNaN(value) : Math.abs(value - expected) < 1e-9;
            if (ok) pass += 1;
            lines.push(`${ok ? 'PASS' : 'FAIL'} ${expr} => ${Number.isNaN(value) ? astText(result) : formatNumber(value)} expected ${expected}`);
          } catch (error) {
            lines.push(`FAIL ${expr} threw ${error.message}`);
          }
        });
        const panel = $('#test-panel');
        panel.classList.add('is-visible');
        panel.textContent = `${pass}/${cases.length} math pipeline tests passed\n${lines.join('\n')}`;
        console.log(panel.textContent);
      }
      return { run };
    })();

    Keypad.init();
    CalcView.init();
    Graph.init();
    Router.init();
    PWA.init();
    Pipeline.runNow('');
    if (new URLSearchParams(location.search).get('test') === '1') Tests.run();
  </script>
</body>
</html>
